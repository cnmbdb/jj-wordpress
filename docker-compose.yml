version: '3.8'

services:
  # WordPress service built from local Dockerfile
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wordpress_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - WORDPRESS_DB_HOST=db
      - WORDPRESS_DB_USER=wp.hfz.pw
      - WORDPRESS_DB_PASSWORD=wp.hfz.pw
      - WORDPRESS_DB_NAME=wp.hfz.pw
      - WP_REDIS_HOST=redis
      - WP_REDIS_PORT=6379
      - WP_REDIS_PREFIX=wp_
      - WP_REDIS_DATABASE=0
      - WP_CACHE=true
      - WP_REDIS_MAXTTL=86400
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - wordpress_cache:/var/www/html/wp-content/cache
      - ./hfz.pw/wp-content:/var/www/html/wp-content/uploads
    networks:
      - wordpress_network

  # MySQL database service using remote image
  db:
    image: mysql:8.0
    container_name: wordpress_db
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=256M
      - --query-cache-type=1
      - --query-cache-size=64M
      - --query-cache-limit=2M
      - --innodb-log-file-size=64M
      - --innodb-flush-log-at-trx-commit=2
      - --max-connections=200
    environment:
      MYSQL_DATABASE: wp.hfz.pw
      MYSQL_USER: wp.hfz.pw
      MYSQL_PASSWORD: wp.hfz.pw
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./wp.hfz.pw_2026-01-12_04-00-04_mysql_data.sql.gz:/docker-entrypoint-initdb.d/database.sql.gz
    networks:
      - wordpress_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache service for WordPress object caching
  redis:
    image: redis:7-alpine
    container_name: wordpress_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10 --save 60 10000
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wordpress_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  wordpress_network:
    driver: bridge

volumes:
  db_data:
    name: wordpress_mysql_data
  redis_data:
    name: wordpress_redis_cache
  wordpress_cache:
    name: wordpress_object_cache
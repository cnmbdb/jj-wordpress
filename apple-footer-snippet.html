<script>
(function () {
  var root = document.getElementById('apple-footer-root');
  if (!root) return;

  var sectionsWrap = document.getElementById('apple-footer-sections');
  var footerBottom = document.getElementById('apple-footer-bottom');
  var sections = root.querySelectorAll('[data-footer-section]');

  function applyFooterLayout() {
    var isMobile = window.innerWidth <= 768;

    sectionsWrap.style.display = isMobile ? 'block' : 'grid';
    sectionsWrap.style.gridTemplateColumns = isMobile ? '' : 'repeat(6,minmax(0,1fr))';
    sectionsWrap.style.gap = isMobile ? '0' : '24px';
    sectionsWrap.style.padding = isMobile ? '12px 20px 0' : '30px 28px 18px';
    footerBottom.style.padding = isMobile ? '18px 20px 24px' : '18px 28px 24px';

    sections.forEach(function (section) {
      var summary = section.querySelector('summary');
      var chevron = section.querySelector('[data-chevron]');
      var content = summary ? summary.nextElementSibling : null;

      if (isMobile) {
        section.open = false;
        section.style.borderBottom = '1px solid rgba(0,0,0,.08)';
        section.style.padding = '0';
        if (summary) {
          summary.style.cursor = 'pointer';
          summary.style.margin = '0';
          summary.style.padding = '16px 0';
          summary.style.userSelect = 'none';
        }
        if (chevron) {
          chevron.style.display = 'inline-block';
          chevron.textContent = section.open ? '−' : '+';
        }
        if (content) {
          content.style.padding = section.open ? '0 0 14px' : '0';
        }
      } else {
        section.open = true;
        section.style.borderBottom = '0';
        if (summary) {
          summary.style.cursor = 'default';
          summary.style.margin = '0 0 14px';
          summary.style.padding = '0';
        }
        if (chevron) {
          chevron.style.display = 'none';
        }
        if (content) {
          content.style.padding = '0';
        }
      }
    });
  }

  sections.forEach(function (section) {
    section.addEventListener('toggle', function () {
      if (window.innerWidth > 768) return;
      var chevron = section.querySelector('[data-chevron]');
      var summary = section.querySelector('summary');
      var content = summary ? summary.nextElementSibling : null;
      if (chevron) chevron.textContent = section.open ? '−' : '+';
      if (content) content.style.padding = section.open ? '0 0 14px' : '0';
    });
  });

  applyFooterLayout();
  window.addEventListener('resize', applyFooterLayout);
})();
</script>
